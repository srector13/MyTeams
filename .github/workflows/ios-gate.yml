name: iOS Gate

on:
  workflow_dispatch:
  push:
    branches:
      - '**'

jobs:
  ios-gate:
    # TODO(GlassUI 0.1): move to the GitHub image that ships Xcode 27 (iOS 27 SDK) once documented; image name unverified.
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Diagnostics
        continue-on-error: true
        run: |
          xcodebuild -version
          xcrun simctl list devices available

      # Boot the test simulator now, so the work iOS does after a fresh
      # boot (indexing, asset and data migration) finishes during the build
      # rather than under the UI tests. Booted later by xcodebuild, it left
      # XCUITest waiting up to two minutes for an app launch (t_2cab5bf3).
      - name: Boot simulator
        continue-on-error: true
        shell: bash
        run: |
          DEST=$(xcrun simctl list devices available | grep -Eo 'iPhone [^(]+' | head -1 | sed 's/[[:space:]]*$//') || true
          [ -z "$DEST" ] && DEST="iPhone 17"
          # The device "name=$DEST,OS=latest" names: the newest iOS runtime's.
          UDID=$(xcrun simctl list devices available -j | DEST="$DEST" python3 -c '
          import json, os, re, sys
          best = None
          for runtime, devices in json.load(sys.stdin)["devices"].items():
              match = re.search(r"iOS-(\d+)-(\d+)(?:-(\d+))?$", runtime)
              if not match:
                  continue
              version = tuple(int(part or 0) for part in match.groups())
              for device in devices:
                  if device["name"] == os.environ["DEST"] and (best is None or version > best[0]):
                      best = (version, device["udid"])
          print(best[1] if best else "")
          ')
          echo "Booting $DEST ($UDID)"
          [ -n "$UDID" ] || exit 0
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          echo "SIM_UDID=$UDID" >> "$GITHUB_ENV"

      - name: Build
        shell: bash
        run: |
          set -o pipefail
          xcodebuild -project myTeams.xcodeproj -scheme myTeams -destination 'generic/platform=iOS Simulator' -skipPackagePluginValidation -skipMacroValidation build CODE_SIGNING_ALLOWED=NO 2>&1 | tee build.log

      - name: Build for testing
        shell: bash
        run: |
          set -o pipefail
          xcodebuild -project myTeams.xcodeproj -scheme myTeams -destination 'generic/platform=iOS Simulator' -skipPackagePluginValidation -skipMacroValidation build-for-testing CODE_SIGNING_ALLOWED=NO 2>&1 | tee build-for-testing.log

      # Deployment target is iOS 26.0: keep an iOS 26 simulator here after the Xcode 27 move (add iOS 27 alongside, not instead).
      - name: Test
        shell: bash
        run: |
          set -o pipefail
          DEST=$(xcrun simctl list devices available | grep -Eo 'iPhone [^(]+' | head -1 | sed 's/[[:space:]]*$//') || true
          [ -z "$DEST" ] && DEST="iPhone 17"
          DESTINATION="platform=iOS Simulator,name=$DEST,OS=latest"
          # The simulator booted before the build, when that step found it.
          [ -n "${SIM_UDID:-}" ] && DESTINATION="platform=iOS Simulator,id=$SIM_UDID"
          xcodebuild -project myTeams.xcodeproj -scheme myTeams -destination "$DESTINATION" -skipPackagePluginValidation -skipMacroValidation test CODE_SIGNING_ALLOWED=NO 2>&1 | tee test.log

      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-gate-logs
          path: ${{ github.workspace }}/*.log
          retention-days: 7
