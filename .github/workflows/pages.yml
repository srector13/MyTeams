# Pages
#
# Publishes the marketing site in site/ to GitHub Pages. The site is plain
# static HTML with no build step: the build job uploads site/ as-is as the
# Pages artifact and the deploy job publishes it.
#
# Runs on a push to main that touches site/** or this workflow, and on demand.
# The repository's Pages source must be set to "GitHub Actions"
# (Settings -> Pages -> Build and deployment -> Source).
#
# Site layout, the screenshot filenames and the placeholder-swap convention:
# site/README.md

name: Pages

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'site/**'
      - '.github/workflows/pages.yml'

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; let an in-progress deployment finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
